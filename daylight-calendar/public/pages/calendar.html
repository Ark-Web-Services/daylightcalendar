<turbo-frame id="calendar-content">
<!-- Calendar Content -->
<header class="calendar-topbar">
  <div class="calendar-nav" aria-label="Calendar navigation">
    <button type="button" class="calendar-topbar-button" data-calendar-action="prev" aria-label="Previous period"><i class="material-icons" aria-hidden="true">chevron_left</i></button>
    <button type="button" class="calendar-topbar-button" data-calendar-action="next" aria-label="Next period"><i class="material-icons" aria-hidden="true">chevron_right</i></button>
    <button type="button" class="calendar-today-button" data-calendar-action="today">Today</button>
  </div>
  <h1 id="calendar-view-title" class="calendar-view-title" aria-live="polite">Loading…</h1>
  <div class="calendar-topbar-end">
    <button type="button" id="door-check-button" class="calendar-door-button" hidden>
      <i class="material-icons" aria-hidden="true">door_front</i>
      <span>Door</span>
    </button>
    <button type="button" id="school-menu-button" class="calendar-school-menu-button" hidden>
      <i class="material-icons" aria-hidden="true">restaurant_menu</i>
      <span>School menu</span>
    </button>
    <div class="calendar-view-switcher" aria-label="Calendar view">
      <button type="button" data-calendar-view="timeGridDay" aria-pressed="false">Day</button>
      <button type="button" data-calendar-view="timeGridWeek" aria-pressed="true">Week</button>
      <button type="button" data-calendar-view="dayGridMonth" aria-pressed="false">Month</button>
    </div>
    <div class="calendar-status" aria-label="Current time and weather">
      <time id="current-time">--:--</time>
      <div class="weather" id="weather-container"><span class="temp">--°</span></div>
    </div>
  </div>
</header>
<div class="calendar-toolbar">
  <div class="calendar-users">
    <div id="user-toggles" class="user-toggle-icons">
      <!-- User icons will be populated by JavaScript -->
    </div>
  </div>
</div>
<main>
  <div id="calendar"></div>
</main>

<div id="door-check-modal" class="modal door-check-modal" role="dialog" aria-modal="true" aria-labelledby="door-check-title">
  <div class="modal-content door-check-sheet">
    <div class="door-check-header">
      <div>
        <h2 id="door-check-title">Door check</h2>
        <p id="door-check-step-label">Look at the camera</p>
      </div>
      <button type="button" class="door-check-close modal-close" aria-label="Close door check">
        <i class="material-icons" aria-hidden="true">close</i>
      </button>
    </div>
    <div class="door-check-body">
      <section id="door-face-stage" class="door-stage door-face-stage" aria-labelledby="door-face-heading">
        <div class="door-camera-frame">
          <video id="door-check-video" autoplay muted playsinline></video>
          <div class="door-camera-guide" aria-hidden="true"></div>
        </div>
        <div class="door-stage-copy">
          <i class="material-icons door-stage-icon" aria-hidden="true">face</i>
          <h3 id="door-face-heading">Look at the camera</h3>
          <p id="door-face-status" aria-live="polite">Starting camera…</p>
        </div>
      </section>

      <section id="door-voice-stage" class="door-stage door-voice-stage" hidden aria-labelledby="door-voice-heading">
        <i class="material-icons door-stage-icon" aria-hidden="true">record_voice_over</i>
        <p id="door-countdown" class="door-countdown" aria-live="assertive"></p>
        <h3 id="door-voice-heading" class="door-phrase">Say the words shown here</h3>
        <div id="door-level" class="door-level" role="progressbar" aria-label="Live microphone level" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="door-level-bar"></span></div>
        <p id="door-voice-status" aria-live="polite">Get ready…</p>
      </section>

      <section id="door-result-stage" class="door-stage door-result-stage" hidden aria-labelledby="door-result-heading">
        <i id="door-result-icon" class="material-icons door-result-icon" aria-hidden="true">check_circle</i>
        <h3 id="door-result-heading" tabindex="-1">Verified</h3>
        <p id="door-result-reason" aria-live="assertive"></p>
        <div class="door-result-actions">
          <button type="button" id="door-try-again" class="btn btn-primary">Try again</button>
          <button type="button" class="btn btn-secondary modal-close">Close</button>
        </div>
      </section>
    </div>
  </div>
</div>

<div id="school-menu-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="school-menu-title">
  <div class="modal-content school-menu-modal-content">
    <div class="modal-header school-menu-modal-header">
      <div>
        <h3 id="school-menu-title">School menu</h3>
        <p id="school-menu-school-name"></p>
      </div>
      <button type="button" class="modal-close" aria-label="Close school menu">&times;</button>
    </div>
    <div class="school-menu-date-controls">
      <button type="button" class="school-menu-day-button" data-school-menu-day="-1" aria-label="Previous day"><i class="material-icons" aria-hidden="true">chevron_left</i></button>
      <strong id="school-menu-date-label">Today</strong>
      <button type="button" class="school-menu-day-button" data-school-menu-day="1" aria-label="Next day"><i class="material-icons" aria-hidden="true">chevron_right</i></button>
    </div>
    <div id="school-menu-modal-body" class="modal-body school-menu-modal-body" aria-live="polite"></div>
  </div>
</div>

<!-- Event details. Tapping an event previously only wrote to the console. -->
<div id="event-detail-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="event-detail-title">
  <div class="modal-content event-detail-content">
    <div class="modal-header">
      <h3 id="event-detail-title">Event</h3>
      <button class="modal-close" id="event-detail-close" aria-label="Close event details">&times;</button>
    </div>
    <div class="modal-body">
      <p class="event-detail-when" id="event-detail-when"></p>
      <div class="event-detail-meta" id="event-detail-meta"></div>
      <p class="event-detail-access" id="event-detail-access" hidden></p>
      <p class="event-detail-location" id="event-detail-location" hidden></p>
      <p class="event-detail-description" id="event-detail-description" hidden></p>
    </div>
  </div>
</div>

</turbo-frame>
