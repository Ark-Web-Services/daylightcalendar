<turbo-frame id="calendar-content">
<!-- Calendar Content -->
<header class="calendar-topbar">
  <div class="calendar-nav" aria-label="Calendar navigation">
    <button type="button" class="calendar-topbar-button" data-calendar-action="prev" aria-label="Previous period"><i class="material-icons" aria-hidden="true">chevron_left</i></button>
    <button type="button" class="calendar-topbar-button" data-calendar-action="next" aria-label="Next period"><i class="material-icons" aria-hidden="true">chevron_right</i></button>
    <button type="button" class="calendar-today-button" data-calendar-action="today">Today</button>
  </div>
  <h1 id="calendar-view-title" class="calendar-view-title" aria-live="polite">Loading…</h1>
  <div class="calendar-topbar-end">
    <div class="calendar-view-switcher" aria-label="Calendar view">
      <button type="button" data-calendar-view="timeGridDay" aria-pressed="false">Day</button>
      <button type="button" data-calendar-view="timeGridWeek" aria-pressed="true">Week</button>
      <button type="button" data-calendar-view="dayGridMonth" aria-pressed="false">Month</button>
    </div>
    <div class="calendar-status" aria-label="Current time and weather">
      <time id="current-time">--:--</time>
      <div class="weather" id="weather-container"><span class="temp">--°</span></div>
    </div>
  </div>
</header>
<div class="calendar-toolbar">
  <div class="calendar-users">
    <div id="user-toggles" class="user-toggle-icons">
      <!-- User icons will be populated by JavaScript -->
    </div>
  </div>
</div>
<main>
  <div id="calendar"></div>
</main>

<!-- Event details. Tapping an event previously only wrote to the console. -->
<div id="event-detail-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="event-detail-title">
  <div class="modal-content event-detail-content">
    <div class="modal-header">
      <h3 id="event-detail-title">Event</h3>
      <button class="modal-close" id="event-detail-close" aria-label="Close event details">&times;</button>
    </div>
    <div class="modal-body">
      <p class="event-detail-when" id="event-detail-when"></p>
      <div class="event-detail-meta" id="event-detail-meta"></div>
      <p class="event-detail-access" id="event-detail-access" hidden></p>
      <p class="event-detail-location" id="event-detail-location" hidden></p>
      <p class="event-detail-description" id="event-detail-description" hidden></p>
    </div>
  </div>
</div>

</turbo-frame>
