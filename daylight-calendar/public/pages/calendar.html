<turbo-frame id="calendar-content">
<!-- Calendar Content -->
<header>
  <div class="date-time">
    <h1 id="current-time">--:--</h1>
    <h2 id="current-date">Loading...</h2>
  </div>
  <div class="weather" id="weather-container">
    <div class="temp">--°</div>
    <div class="condition"><i class="material-icons">cloud</i></div>
  </div>
</header>
<section id="home-motivation-loop" class="home-motivation-loop" aria-labelledby="home-motivation-title">
  <div class="home-motivation-header"><div><h2 id="home-motivation-title">Household momentum</h2><p>Stars, routines, and a chance to help.</p></div><button type="button" class="btn btn-secondary" data-home-loop-toggle aria-expanded="true" aria-controls="home-motivation-content"><i class="material-icons" aria-hidden="true">expand_less</i><span class="home-loop-toggle-copy">Hide</span></button></div>
  <div id="home-motivation-content" class="home-motivation-content" aria-live="polite"></div>
</section>
<div class="calendar-toolbar">
  <div class="calendar-users">
    <div class="users-toggle-label">Profiles:</div>
    <div id="user-toggles" class="user-toggle-icons">
      <!-- User icons will be populated by JavaScript -->
    </div>
  </div>
</div>
<main>
  <div id="calendar"></div>
</main>
<footer>
  <div class="next-event" id="next-event">
    <h3>Next Event</h3>
    <p id="next-event-info">No upcoming events</p>
  </div>
</footer>

<!-- Event details. Tapping an event previously only wrote to the console. -->
<div id="event-detail-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="event-detail-title">
  <div class="modal-content event-detail-content">
    <div class="modal-header">
      <h3 id="event-detail-title">Event</h3>
      <button class="modal-close" id="event-detail-close" aria-label="Close event details">&times;</button>
    </div>
    <div class="modal-body">
      <p class="event-detail-when" id="event-detail-when"></p>
      <div class="event-detail-meta" id="event-detail-meta"></div>
      <p class="event-detail-access" id="event-detail-access" hidden></p>
      <p class="event-detail-location" id="event-detail-location" hidden></p>
      <p class="event-detail-description" id="event-detail-description" hidden></p>
    </div>
  </div>
</div>

</turbo-frame>
